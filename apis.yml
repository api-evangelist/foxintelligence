name: Foxintelligence
description: 'Foxintelligence was a French e-commerce measurement and consumer-insights
  company that aggregated anonymized online purchase data from email receipts across
  millions of e-shoppers to give brands and retailers competitive intelligence on
  where, when, and how much consumers buy online. It was acquired by NielsenIQ and
  operates today as the "NIQ Digital Purchases" product; the original www.foxintelligence.io
  domain now 301-redirects to nielseniq.com. The surviving first-party surface is the
  customer web application at app.foxintelligence.io (login only). No public API,
  OpenAPI, SDK, or developer documentation is published; this profile is maintained
  as an acquired-company record in the API Evangelist network.'
